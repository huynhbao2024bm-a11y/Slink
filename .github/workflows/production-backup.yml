name: Production encrypted backup

on:
  schedule:
    # 02:00 Vietnam time (UTC+7) every day
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: Optional note for this manual backup
        required: false
        default: manual-backup

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out backup tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run AES-256-GCM encrypted backup and verify checksum
        env:
          BACKUP_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SLINK_BACKUP_ENCRYPTION_KEY: ${{ secrets.SLINK_BACKUP_ENCRYPTION_KEY }}
          SLINK_BACKUP_KEY_ID: ${{ vars.SLINK_BACKUP_KEY_ID || 'prod-v1' }}
          SLINK_BACKUP_DIR: .backup-out
          BACKUP_REASON: ${{ github.event.inputs.reason || 'scheduled-daily' }}
          PG_SSL: ca-file
          PG_SSL_CA_FILE: ${{ github.workspace }}/supabase-ca.crt
        run: |
          mkdir -p "$SLINK_BACKUP_DIR"
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$SLINK_BACKUP_ENCRYPTION_KEY" ]; then
            echo "Missing MIGRATION_DATABASE_URL or SLINK_BACKUP_ENCRYPTION_KEY secret." >&2
            exit 1
          fi
          node scripts/postgres-backup.js create
          MANIFEST=$(ls -1 "$SLINK_BACKUP_DIR"/*.manifest.json | head -n 1)
          node scripts/postgres-backup.js verify "$MANIFEST"
          echo "### Encrypted Backup Verified" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Manifest: `%s`\n' "$(basename "$MANIFEST")" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- Reason: `%s`\n' "${BACKUP_REASON//\`/}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted backup artifact (30-day retention)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slink-encrypted-backup-${{ github.run_number }}
          path: .backup-out/*
          retention-days: 30
          if-no-files-found: error
