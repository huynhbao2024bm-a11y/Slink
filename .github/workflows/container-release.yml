name: Publish Slink container

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js and pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24.22.0
          require-lockfile: true
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run acceptance suite
        run: pnpm test
      - name: Sign in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish versioned image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/slink"
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --tag "$image:$GITHUB_REF_NAME" \
            --tag "$image:latest" .
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:latest"
