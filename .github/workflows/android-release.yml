name: Publish Android update

on:
  push:
    tags: ['android-v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Local APK publication works without exporting the developer's signing key.
    # Opt in only after the repository has its stable signing secrets.
    if: ${{ vars.ANDROID_AUTOBUILD == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out exact release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure the signing key before publishing an Android update.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/slink-release.jks"
      - name: Build and verify signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/slink-release.jks"
          version="${GITHUB_REF_NAME#android-v}"
          # One monotonically increasing code for numeric major.minor.patch tags.
          IFS=. read -r major minor patch <<< "$version"
          [[ "$major.$minor.$patch" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          (( major < 1000 && minor < 1000 && patch < 1000 ))
          code=$(( 10#$major * 1000000 + 10#$minor * 1000 + 10#$patch ))
          cd android
          bash gradlew --no-daemon ":app:assembleRelease" "-PslinkVersionCode=$code" "-PslinkVersionName=$version"
          cd ..
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Slink.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Slink.apk
          node scripts/android-release-manifest.js dist/Slink.apk "$code" "$version" "$GITHUB_REF_NAME" dist/android-update.json
          node --test server/test/android-release.test.js
      - name: Publish both files together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Slink.apk dist/android-update.json --verify-tag --title "Slink ${GITHUB_REF_NAME#android-v}" --generate-notes --draft
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/slink-release.jks"
