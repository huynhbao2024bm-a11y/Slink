name: Publish Android update

on:
  push:
    tags: ['android-v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version (e.g. 0.9.5.0)
        required: true
        type: string
      version_code:
        description: Optional monotonic Android versionCode (e.g. 3036)
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    # Local APK publication works without exporting the developer's signing key.
    # Opt in only after the repository has its stable signing secrets.
    if: ${{ vars.ANDROID_AUTOBUILD == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out exact release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure the signing key before publishing an Android update.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/slink-release.jks"
      - name: Build and verify signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          DISPATCH_CODE: ${{ github.event.inputs.version_code }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/slink-release.jks"
          version="${DISPATCH_VERSION:-${GITHUB_REF_NAME#android-v}}"
          tag_name="android-v${version}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"; hotfix="${BASH_REMATCH[5]:-0}"
          if [ -n "$DISPATCH_CODE" ]; then
            code="$DISPATCH_CODE"
          else
            code=$(( 10#$major * 1000000 + 10#$minor * 10000 + 10#$patch * 100 + 10#$hotfix ))
          fi
          cd android
          bash gradlew --no-daemon ":app:assembleRelease" "-PslinkVersionCode=$code" "-PslinkVersionName=$version"
          cd ..
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Slink.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Slink.apk
          node scripts/android-release-manifest.js dist/Slink.apk "$code" "$version" "$tag_name" dist/android-update.json
          node --test server/test/android-release.test.js
      - name: Publish both files together
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="${DISPATCH_VERSION:-${GITHUB_REF_NAME#android-v}}"
          tag_name="android-v${version}"
          gh release create "$tag_name" dist/Slink.apk dist/android-update.json --title "Slink $version" --generate-notes --draft
          gh release edit "$tag_name" --draft=false --latest
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/slink-release.jks"
