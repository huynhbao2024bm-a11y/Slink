name: slink

services:
  database:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: slink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
      - slink_app_password
      - slink_migrator_password
      - database_server_certificate
      - database_server_key
    volumes:
      - /var/lib/slink/postgres:/var/lib/postgresql
      - ./postgres-init/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/database_server_certificate
      - -c
      - ssl_key_file=/run/secrets/database_server_key
      - -c
      - password_encryption=scram-sha-256
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slink"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  api:
    image: ${SLINK_API_IMAGE:?Set SLINK_API_IMAGE in /etc/slink/release.env}
    restart: unless-stopped
    env_file:
      - /etc/slink/app.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PG_SSL: ca-file
      PG_SSL_CA_FILE: /run/secrets/database_ca_certificate
      DB_POOL_MAX: 8
      TRUSTED_PROXY_IPS: 172.31.0.0/24
      LOG_LEVEL: info
      APP_DATABASE_URL_FILE: /run/secrets/app_database_url
      EMAIL_DELIVERY_URL_FILE: /run/secrets/email_delivery_url
      EMAIL_DELIVERY_TOKEN_FILE: /run/secrets/email_delivery_token
    secrets:
      - database_ca_certificate
      - app_database_url
      - email_delivery_url
      - email_delivery_token
    depends_on:
      database:
        condition: service_healthy
    networks:
      - database
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SLINK_DOMAIN: ${SLINK_DOMAIN:?Set SLINK_DOMAIN after choosing the domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/slink/caddy-data:/data
      - /var/lib/slink/caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

  operations:
    image: ${SLINK_OPS_IMAGE:?Set SLINK_OPS_IMAGE in /etc/slink/release.env}
    profiles: ["operations"]
    env_file:
      - /etc/slink/operations.env
    environment:
      NODE_ENV: production
      PG_SSL: ca-file
      PG_SSL_CA_FILE: /run/secrets/database_ca_certificate
      SLINK_BACKUP_DIR: /backups
      SLINK_BACKUP_KEY_ID: backup-encryption-key-v1
      PG_DUMP_BIN: pg_dump
      PG_RESTORE_BIN: pg_restore
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
      BACKUP_DATABASE_URL_FILE: /run/secrets/backup_database_url
      SLINK_BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
    secrets:
      - database_ca_certificate
      - migration_database_url
      - backup_database_url
      - backup_encryption_key
    volumes:
      - /var/lib/slink/backups:/backups
    networks:
      - database
    command: ["scripts/postgres-backup.js", "create"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  database:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

secrets:
  postgres_admin_password:
    file: /etc/slink/secrets/postgres-admin-password
  slink_app_password:
    file: /etc/slink/secrets/slink-app-password
  slink_migrator_password:
    file: /etc/slink/secrets/slink-migrator-password
  app_database_url:
    file: /etc/slink/secrets/app-database-url
  migration_database_url:
    file: /etc/slink/secrets/migration-database-url
  backup_database_url:
    file: /etc/slink/secrets/backup-database-url
  email_delivery_url:
    file: /etc/slink/secrets/email-delivery-url
  email_delivery_token:
    file: /etc/slink/secrets/email-delivery-token
  backup_encryption_key:
    file: /etc/slink/secrets/backup-encryption-key-v1
  database_server_certificate:
    file: /etc/slink/db-tls/server.crt
  database_server_key:
    file: /etc/slink/db-tls/server.key
  database_ca_certificate:
    file: /etc/slink/db-tls/server.crt
