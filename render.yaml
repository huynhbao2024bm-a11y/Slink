services:
  - type: web
    name: slink
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node server/index.js
    healthCheckPath: /api/ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.0
      - key: HOST
        value: 0.0.0.0
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: PG_SSL
        value: ca-file
      - key: PG_SSL_CA_FILE
        value: /opt/render/project/src/supabase-ca.crt
      - key: LOG_LEVEL
        value: info
      - key: PUBLIC_ORIGIN
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: EMAIL_DELIVERY_URL
        sync: false
      - key: EMAIL_DELIVERY_TOKEN
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: GHN_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
