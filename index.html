<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123f35" />
    <meta name="description" content="Slink — quản lý bán hàng gọn gàng, rõ ràng, ngay trên điện thoại." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Slink" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./assets/slink-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/slink-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/slink-icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./workspace.css" />
    <title>Slink — Quản lý bán hàng</title>
  </head>
  <body class="easy-ui calm-ui">
    <main id="auth-screen" class="auth-screen" hidden></main>
    <div class="app-shell" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 8.5h16v5H13v2h11v8H8v-5h11v-2H8z" fill="currentColor"/><circle cx="24.5" cy="7.5" r="2.5" fill="#c8f36c"/></svg></span>
          <span class="brand-name">slink<span class="brand-period">.</span></span>
        </div>
        <div class="store-switcher" id="store-switcher">
          <span class="store-avatar">L</span>
          <span class="store-meta"><strong id="sidebar-store-name">Cửa hàng</strong><small>Cửa hàng của bạn</small></span>
          <span class="switch-chevron">⌄</span>
        </div>
        <nav class="primary-nav" id="primary-nav" aria-label="Điều hướng chính"></nav>
        <div class="sidebar-bottom">
          <button class="sidebar-help" data-action="help">Trợ giúp</button>
          <button class="profile-button" data-action="account-menu" aria-label="Mở menu tài khoản" aria-haspopup="dialog"><span class="profile-avatar">S</span><span><strong>Slink</strong><small>Đăng xuất</small></span><span class="profile-more" aria-hidden="true">⌄</span></button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="mobile-brand" data-route="pos" aria-label="Bán hàng"><span class="brand-mark"><svg viewBox="0 0 32 32"><path d="M8 8.5h16v5H13v2h11v8H8v-5h11v-2H8z" fill="currentColor"/><circle cx="24.5" cy="7.5" r="2.5" fill="#c8f36c"/></svg></span><span class="brand-name">slink<span class="brand-period">.</span></span></button>
          <div class="topbar-left"><span class="crumb" id="crumb">Tổng quan</span><span class="crumb-separator">/</span><span class="crumb-current" id="crumb-current">Hôm nay</span></div>
          <span class="workspace-name"></span>
          <div class="topbar-right"><span class="connection-status" id="connection-status" role="status" aria-live="polite" aria-atomic="true"><i></i> Đang kiểm tra kết nối</span><button class="icon-button help-button" aria-label="Trợ giúp" data-action="help">?</button><button class="topbar-avatar" data-action="account-menu" aria-label="Mở menu tài khoản" aria-haspopup="dialog">S</button></div>
        </header>
        <section id="offline-status" class="offline-status" role="status" aria-live="polite" hidden></section>
        <div id="pending-compatibility-warning" class="auth-message error pending-compatibility-warning" role="alert" aria-live="assertive" hidden>
          <span><strong>Cần đối soát thao tác cũ.</strong> Có bản chờ từ phiên bản trước chưa gắn với tài khoản. Hãy kiểm tra đơn hàng, công nợ, sổ quỹ và tồn kho trên máy chủ trước khi nhập lại.</span>
          <button class="link-button" type="button" data-action="review-legacy-pending">Đã đối soát · xóa bản lưu cũ</button>
        </div>
        <section id="view" class="view" aria-live="polite"></section>
      </main>
      <nav class="mobile-nav" id="mobile-nav" aria-label="Điều hướng nhanh"></nav>
    </div>
    <div class="modal-backdrop" id="modal-backdrop" hidden></div>
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-description" hidden></section>
    <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>
    <script src="./assets/vendor/gsap.min.js" defer></script>
    <script src="./offline-ledger.js" defer></script>
    <script src="./offline-store.js" defer></script>
    <script src="./offline-sync.js" defer></script>
    <script src="./app.js" defer></script>
    <script src="./register-sw.js" defer></script>
  </body>
</html>
