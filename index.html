        <h1>Slink — Phần mềm quản lý bán hàng POS, tồn kho đa chi nhánh và sổ quỹ số nguyên VND</h1>
        <p>Slink giúp cửa hàng thời trang, mỹ phẩm, tạp hóa và bán lẻ đa kênh tính tiền tại quầy (POS), quản lý biến thể màu/size, theo dõi tồn kho nhiều chi nhánh, công nợ khách hàng/nhà cung cấp và chốt ca thu ngân chính xác từng đồng trên Web và Android 10+.</p>
        <ul>
          <li>Bán hàng tại quầy (POS), gộp phương thức thanh toán, tạo mã VietQR và in bill nhiệt Bluetooth 58mm/80mm.</li>
          <li>Quản lý hàng hóa, biến thể Màu/Size, mã vạch, Serial/IMEI và cảnh báo định mức tồn kho.</li>
          <li>Sổ quỹ tiền mặt/ngân hàng số nguyên VND, công nợ khách hàng, đặt hàng nhà cung cấp (PO) và điều chuyển đa kho.</li>
          <li>Cô lập dữ liệu từng cửa hàng, phân quyền 5 vai trò và nhật ký kiểm toán thao tác.</li>
        </ul>
